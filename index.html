<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet the Cat Meme</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <div id="cat-container"></div>
        <div id="ball"></div>
    </div>
    <div id="pitch-control">
        <label for="pitch-slider">Pitch: </label>
        <input type="range" id="pitch-slider" min="0.5" max="2.0" step="0.1" value="1.0">
    </div>
    <audio id="HuhCat" src="HuhCat.m4a"></audio>
    <audio id="OiiCat" src="OiiCat.m4a"></audio>
    <audio id="BababoiCat" src="BababoiCat.m4a"></audio>
    <audio id="BananaCat" src="BananaCat.m4a"></audio>
    <script src="sketch.js"></script>
</body>
</html>
